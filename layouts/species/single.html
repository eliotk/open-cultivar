{{ define "main" }}
<div class="container">
  <article>
    <h1>{{ .Title }}</h1>
    
    {{ with .Params.scientific_name }}
      <p><em>Scientific Name: {{ . }}</em></p>
    {{ end }}

    {{ with .Params.image }}
      <img src="{{ . | relURL }}" alt="{{ $.Title }}" style="max-width: 300px;">
    {{ end }}

    <div>{{ .Content }}</div>
  </article>
</div>
{{ end }}
